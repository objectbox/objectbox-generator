# https://docs.gitlab.com/ce/ci/yaml/

.build:
  script:
    - make info
    - make
    - make test-depend
    - make test

.build-linux:
  extends: [ .build ]
  tags: [ x64, linux, docker ]
  image:
    name: objectboxio/buildenv-generator-ubuntu:2024-02-26
    pull_policy: [if-not-present]

# Available go versions in objectboxio/buildenv-generator-ubuntu:2024-02-26:
#
# Version | Location (GOROOT)     | Notes
# ------- | --------------------- | -------------------------------------------------
# 1.18.1  | /usr/lib/go-1.18      | (Ubuntu 22.04 package)
# 1.22.0  | /usr/local/go1.22     | Manual installed version (default first on PATH)
# 1.19.13 | /root/sdk/go1.19.13   | Additional version installed via go install

bt:linux-x64:go1.18:
  extends: [ .build-linux ]
  before_script:
    - export PATH=/usr/lib/go-1.18/bin:$PATH

bt:linux-x64:go1.19:
  extends: [ .build-linux ]
  before_script:
    - export PATH=/root/sdk/go1.19.13/bin:$PATH

bt:linux-x64:go1.22:
  extends: [ .build-linux ]
  after_script:
    - apt-get update
    - apt-get install -y zip
    - zip objectbox-generator-Linux.zip objectbox-generator
  artifacts:
    expire_in: 1 day
    paths:
      - objectbox-generator-Linux.zip

bt:mac:
  extends: [ .build ]
  tags: [ mac, go, xcode ]
  after_script:
    - zip objectbox-generator-macOS.zip objectbox-generator
  artifacts:
    expire_in: 1 day
    paths:
      - objectbox-generator-macOS.zip

t:cmake:win-x64:
  extends: [ .build ]
  tags: [ windows, go ]
  after_script:
    - zip objectbox-generator-Windows.zip objectbox-generator.exe
  artifacts:
    expire_in: 1 day
    paths:
      - objectbox-generator-Windows.zip
